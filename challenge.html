
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Speed Challenge</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #edf4ff, #e2edfa);
  color: #172b4d;
}
.container {
  max-width: 1050px;
  margin: 70px auto;
  padding: 25px;
  text-align: center;
}
.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-top: 40px;
}
.card {
  background: white;
  padding: 35px 15px;
  border-radius: 18px;
  box-shadow: 0 8px 25px rgba(0,0,0,.08);
}
button {
  background: #1769e0;
  color: white;
  border: 0;
  padding: 13px 22px;
  border-radius: 30px;
  cursor: pointer;
  font-size: 15px;
}
@media(max-width:650px) {
  .cards { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="container">
  <h1>Who Can You Read Faster Than?</h1>
  <p>Challenge your reading speed against three reading levels.</p>

  <div class="cards">
    <div class="card">
      <h2>5th Grader</h2>
      <p>School Reading Level</p>
      <button>Challenge Now</button>
    </div>
    <div class="card">
      <h2>College Student</h2>
      <p>Graduate Reading Level</p>
      <button>Challenge Now</button>
    </div>
    <div class="card">
      <h2>Professor</h2>
      <p>Advanced Reading Level</p>
      <button>Challenge Now</button>
    </div>
  </div>
</div>
</body>
</html>
