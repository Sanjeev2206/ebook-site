
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Speed Challenge | Read for Speed</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eaf0fb;
  color: #102344;
}

/* COMPACT EBOOK HEADER */

.hero {
  background: linear-gradient(135deg, #071a35, #123766, #071a35);
  color: white;
  text-align: center;
  padding: 30px 20px 175px;
}

.hero h1 {
  font-family: Georgia, serif;
  font-size: clamp(27px, 4vw, 42px);
  font-weight: 800;
  letter-spacing: 2px;
  margin: 0;
}

.hero p {
  font-size: 16px;
  color: #d5dfef;
  margin: 10px 0 0;
}

.language-section {
  max-width: 1250px;
  margin: -165px auto 15px;
  position: relative;
  z-index: 2;
  background: #ffffff;
  border-radius: 25px;
  padding: 35px;
  box-shadow: 0 18px 50px rgba(20,45,90,.15);
}

.step-label {
  text-align: center;
  color: #5969dc;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 1.5px;
}

.language-section h2 {
  text-align: center;
  font-size: 32px;
  margin: 12px 0 35px;
}

.language-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.language-card {
  text-decoration: none;
  color: #102344;
  border-radius: 20px;
  padding: 30px 20px;
  text-align: center;
  border: 1px solid #dce5f5;
  transition: .25s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.english {
  background: linear-gradient(145deg, #edf4ff, #ffffff);
  border-color: #6b9cff;
}

.hindi {
  background: linear-gradient(145deg, #fff4e9, #ffffff);
  border-color: #efa85e;
}

.korean {
  background: linear-gradient(145deg, #f2edff, #ffffff);
  border-color: #9c7af0;
}

.language-card:hover {
  transform: translateY(-7px);
  box-shadow: 0 15px 30px rgba(20,45,90,.12);
}

.flag {
  width: 76px;
  height: 52px;
  object-fit: contain;
  margin-bottom: 15px;
}

.language-card h3 {
  font-size: 27px;
  margin: 0 0 12px;
}

.language-card p {
  font-size: 15px;
  color: #52627b;
  line-height: 1.6;
  min-height: 48px;
  margin: 0 0 20px;
}

.continue {
  display: inline-block;
  padding: 13px 22px;
  border-radius: 30px;
  background: #1556d8;
  color: white;
  font-weight: bold;
  margin-top: auto;
}

.hindi .continue {
  background: #df710d;
}

.korean .continue {
  background: #5526b9;
}

.footer {
  text-align: center;
  padding: 25px 10px 5px;
  font-size: 16px;
  font-weight: 600;
  color: #243c65;
}

.back-link {
  display: block;
  text-align: center;
  margin-top: 25px;
  color: #4267a8;
  text-decoration: none;
}

@media(max-width:750px) {
  .language-grid {
    grid-template-columns: 1fr;
  }

  .language-section {
    margin: -35px 12px 25px;
    padding: 28px 18px;
  }

  .language-section h2 {
    font-size: 25px;
  }
}
  

.language-section {
  margin-top: -165px;
  margin-bottom: 15px;
  padding: 22px 28px;
}
.language-section h2 {
  font-size: 25px;
  margin: 8px 0 20px;
}

.language-grid {
  gap: 16px;
}

.language-card {
  padding: 17px 14px;
}

.flag {
  width: 58px;
  height: 38px;
  margin-bottom: 8px;
}

.language-card h3 {
  font-size: 22px;
  margin-bottom: 7px;
}

.language-card p {
  font-size: 13px;
  min-height: 38px;
  margin-bottom: 12px;
}

.continue {
  padding: 10px 17px;
  font-size: 13px;
}

.footer {
  padding: 15px 5px 0;
  font-size: 14px;
}

.back-link {
  margin-top: 12px;
}
@media(max-width:750px) {

  .hero {
    padding: 25px 15px 145px;
  }

  .hero h1 {
    font-size: 27px;
    letter-spacing: 1px;
  }

  .language-section {
    margin-top: -125px;
    margin-left: 12px;
    margin-right: 12px;
  }

}
</style>
</head>

<body>

<section class="hero">

  <h1>READ FOR SPEED EBOOK</h1>

 
</section>

<section class="language-section">

    <h2>Choose Your Reading Language</h2>

 
<div class="language-grid">

  <!-- KOREAN - FIRST -->
  <a class="language-card korean"
     href="challenge.html?lang=ko">

    <img class="flag"
         src="https://flagcdn.com/w80/kr.png"
         alt="South Korea flag">

    <h3>한국어</h3>

    <p>
      한국 대학생을 위한
      <br>
      독서 속도 챌린지
    </p>

    <span class="continue">
      한국어로 시작하기 →
    </span>

  </a>

  <!-- ENGLISH - SECOND -->
  <a class="language-card english"
     href="challenge.html?lang=en">

    <img class="flag"
         src="https://flagcdn.com/w80/gb.png"
         alt="United Kingdom flag">

    <h3>English</h3>

    <p>
      Academic and international reading
    </p>

    <span class="continue">
      Continue in English →
    </span>

  </a>

  <!-- HINDI - THIRD -->
  <a class="language-card hindi"
     href="challenge.html?lang=hi">

    <img class="flag"
         src="https://flagcdn.com/w80/in.png"
         alt="India flag">

    <h3>हिन्दी</h3>

    <p>
      भारतीय विद्यार्थियों के लिए
      <br>
      पढ़ने की गति चुनौती
    </p>

    <span class="continue">
      हिन्दी में आगे बढ़ें →
    </span>

  </a>

</div>

  <a class="back-link" href="index.html">
    ← Back to Home
  </a>

</section>

</body>
</html>
